# Railway deployment configuration
# For deploying to Railway.app

name: sar-oil-spill-detection

build:
  buildCommand: pip install -r requirements.txt
  watchPatterns:
    - "**/*.py"
    - "requirements.txt"
    - "config/**/*"

start:
  startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

variables:
  PYTHONPATH: /app
  ENVIRONMENT: production

services:
  web:
    build:
      buildCommand: pip install -r requirements.txt
    deploy:
      startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
      restartPolicyType: always
    variables:
      NODE_ENV: production
      PYTHONPATH: /app

healthcheck:
  path: /health
  port: $PORT
  interval: 30s
  timeout: 10s
  retries: 3