# Railway.app deployment (https://railway.app)
#
# Railway autodetects the Python project from pyproject.toml; this file pins
# the build and start commands and wires up the health check.

build:
  buildCommand: pip install --upgrade pip && pip install '.[api]'
  watchPatterns:
    - "src/**/*.py"
    - "api/**/*.py"
    - "config/**"
    - "pyproject.toml"

deploy:
  startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
  restartPolicyType: on_failure
  restartPolicyMaxRetries: 3
  healthcheckPath: /health
  healthcheckTimeout: 30

variables:
  ENVIRONMENT: production
