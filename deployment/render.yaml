# Render.com deployment (https://render.com)
#
# Connect the repository in the Render dashboard and point it at this file.
# The free plan sleeps after inactivity; the first request afterwards pays the
# cold-start cost of importing SciPy and OpenCV (roughly 10-20 s).

services:
  - type: web
    name: sar-oil-spill-detection
    runtime: python
    plan: free

    # Installs the package itself plus the `api` extra, so `sar_oil_spill`
    # is importable without any PYTHONPATH juggling.
    buildCommand: pip install --upgrade pip && pip install '.[api]'
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"

    healthCheckPath: /health
    autoDeploy: true

    buildFilter:
      paths:
        - api/**
        - src/**
        - config/**
        - pyproject.toml
