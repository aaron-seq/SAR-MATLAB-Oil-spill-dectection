# Local development stack.
#
#   docker compose up --build          # API on :8000
#   docker compose --profile ui up     # API + Streamlit UI on :8501

services:
  api:
    build:
      context: .
      target: production
    image: sar-oil-spill:latest
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
    volumes:
      # Persist outputs and any model checkpoints across container restarts.
      - ./results:/app/results
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  ui:
    profiles: ["ui"]
    build:
      context: .
      target: development
    image: sar-oil-spill:dev
    command: >
      streamlit run app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
    ports:
      - "8501:8501"
    volumes:
      - ./results:/app/results
    restart: unless-stopped
